before: |
  -- What a script writes, without crush's exit status.
  function out(...)
     return (crushed(...))
  end

specify crush:
- it runs a command with words and quotes: |
    expect(out [[printf '%s|' a 'b  c' "d  e" f\ g '' x]]).
       to_be 'a|b  c|d  e|f g||x|'

- it ends a command at a semicolon or a newline, and skips comments: |
    expect(out "printf a; printf b # not c\nprintf '%s' d \\\n  e\n").
       to_be 'abde'

- it sets a variable to a list, and joins the parts of a word: |
    expect(out [[x=[a 'b c']; printf '[%s]' $x; y=[1 2]; printf ' %s' $x$y -$y]]).
       to_be '[a][b c] a1 b c2 -1 -2'
    expect(out [[x=[a b]; y=[1 2 3]; printf %s $x$y]]).
       to_contain 'lists of different lengths'

- it drops a word that is joined with an empty list, unless it is quoted: |
    expect(out [[x=; printf '(%s)' a$x b "$x" '']]).to_be '(b)()()'

- it takes an unset variable from the environment, split at blanks: |
    local env = "CFLAGS='-O2  -g' DIR='a  b' "
    expect(out([[printf '<%s>' $CFLAGS $DIR "$DIR"]], env)).
       to_be '<-O2><-g><a><b><a  b>'

- it passes a variable to a command only when it is written before it: |
    expect(out [[x=1; sh -c 'printf "(%s)" "$x"'; x=2 sh -c 'printf "(%s)" "$x"']]).
       to_be '()(2)'

- it redirects output to a file: |
    expect(out [[printf a > f; printf b >> f; sh -c 'printf c >&2' 2> g; cat f g]]).
       to_be 'abc'

- it shows a command that run runs, with its words quoted: |
    expect(out [[x=[a 'b c']; run printf '<%s>' $x '']]).
       to_be "% printf '<%s>' a 'b c' ''\n<a><b c><>"

- it changes directory, and stops at exit: |
    expect(out "mkdir d; cd d; pwd; exit 4; printf no").to_match '/d\n$'
    expect(select(2, crushed 'exit 4')).to_be(4)

- it writes the bytes of a file as C with embed: |
    local c = out [[printf 'a"b\n\0' > f; embed name f]]
    expect(c).to_contain 'const unsigned char name_data[] ='
    expect(c).to_contain '"a\\"b\\n"\n    "\\000";'
    expect(c).to_contain 'const unsigned long name_size = 5;'

- it writes the SHA-256 sum of each file with sha256: |
    local sums = out [[printf abc > a; printf '' > b; sha256 a b]]
    expect(sums).to_be(
       'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad  a\n' ..
       'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855  b\n')

- it sums a file that needs more than one block of padding, and a long one: |
    expect(out [[printf abcdbcdecdefdefgefghfghighijhijkijkljklmklmnlmnomnopnopq > f; sha256 f]]).
       to_be '248d6a61d20638b8e5c026930c3e6039a33ce45964ff2167f6ecedd419db06c1  f\n'
    expect(out [[sh -c 'head -c 1000000 /dev/zero | tr "\0" a' > f; sha256 f]]).
       to_be 'cdc76e5c9914fb9281a1c7e284d73e67f1809a48a497200e046d39ccc7112cd0  f\n'

- it redirects the sums, and goes on after a file that it cannot read: |
    expect(out [[printf a > x; sha256 x > sums; cat sums]]).
       to_be 'ca978112ca1bbdcafac231b39a23dc4da786eff8147c4e72b9807785afee48bb  x\n'
    local text, status = crushed 'printf b > y; sha256 nosuch y'
    expect(status).to_be(1)
    expect(text).to_contain 'sha256: nosuch: '
    expect(text).to_contain '3e23e8160039594a33894f6564e1b1348bbd7a0088d42c4acb73eeaed59c009d  y'
    expect(select(2, crushed 'sha256')).to_be(1)

- it runs the command after || only if the one before it fails: |
    expect(out [[printf a || printf b]]).to_be 'a'
    expect(out [[false || printf b]]).to_be 'b'
    expect(out [[false||printf x]]).to_be 'x'
    expect(out [[false || false || printf c]]).to_be 'c'
    expect(out [[printf a || printf b || printf c]]).to_be 'a'
    expect(out [[false > f || printf z > g; cat g]]).to_be 'z'

- it goes on after a chain with || that works, and ends after one that does not: |
    expect(out "false || true; printf next").to_be 'next'
    local text, status = crushed "sh -c 'exit 3' || sh -c 'exit 4'; printf no"
    expect(text).to_be ''
    expect(status).to_be(4)

- it runs the commands of a for once for each item, with its name set: |
    expect(out [[for f in a 'b c' d { printf '[%s]' $f; }]]).to_be '[a][b c][d]'
    expect(out [[for f in a 'b c' d { printf '[%s]' $f }]]).to_be '[a][b c][d]'
    expect(out [[x=[1 2]; for f in $x z { printf %s $f; }]]).to_be '12z'
    expect(out "for f in a b {\n  printf $f\n  printf -\n}\nprintf end").
       to_be 'a-b-end'

- it ends a for at a } that is a word of its own, and no other: |
    expect(out "for f in a b {\n printf $f\n}\nprintf end").to_be 'abend'
    expect(out "for f in a b {\n printf $f }\nprintf end").to_be 'abend'
    expect(out [[for f in a { printf %s '}' }; printf %s }]]).to_be '}}'
    expect(out [[for f in a { printf x; printf '%s' }x }]]).to_be 'x}x'
    expect(out [[for a in 1 2 { for b in x y { printf $a$b, } }]]).
       to_be '1x,1y,2x,2y,'

- it goes on after a for with || only if a command of its body fails: |
    expect(out [[for f in a b { printf $f; false } || printf '!']]).to_be 'a!'
    expect(out [[for f in a b { printf $f } || printf '!']]).to_be 'ab'
    expect(out [[false || for f in a b { printf $f }]]).to_be 'ab'
    expect(out [[for f in a { false } || for g in c { printf $g } || printf x]]).
       to_be 'c'
    local text, status = crushed "for f in a { sh -c 'exit 6' } || sh -c 'exit 7'; printf no"
    expect(text).to_be ''
    expect(status).to_be(7)

- it takes the items of a for as many at a time as it has names: |
    expect(out [[
       rows=[
          lua.tar.gz   https://lua.org   aaaa
          luke.tar.gz  https://github    bbbb
       ]
       for file url sum in $rows { printf '(%s %s %s)' $file $url $sum; }
    ]]).to_be '(lua.tar.gz https://lua.org aaaa)(luke.tar.gz https://github bbbb)'
    expect(out [[for k v in a 1 b 2 { printf '%s=%s,' $k $v; }]]).to_be 'a=1,b=2,'

- it runs a for inside a for, and runs nothing for no items: |
    expect(out "for a in 1 2 {\n for b in x y {\n  printf $a$b,\n }\n}").
       to_be '1x,1y,2x,2y,'
    expect(out [[for f in { printf no; }; printf yes]]).to_be 'yes'
    expect(out [[none=; for a b in $none { printf no; }; printf yes]]).to_be 'yes'

- it leaves the names of a for set, and ends the script if a command of it fails: |
    expect(out [[for f in a b { true; }; printf %s $f]]).to_be 'b'
    local text, status = crushed "for f in a b {\n printf $f\n sh -c 'exit 5'\n}\nprintf no"
    expect(text).to_be 'a'
    expect(status).to_be(5)

- it refuses a for with items that do not fill its last pass, before its first: |
    local text, status = crushed "printf yes\nfor a b in 1 2 3 {\n printf no\n}"
    expect(text).to_match '^yes'
    expect(text).not_to_contain 'no\n'
    expect(text).to_contain 'do not fill the last pass'
    expect(status).to_be(3)

- it runs the statements of a block, and what they set stays set: |
    expect(out [[{ printf a; printf b }; printf c]]).to_be 'abc'
    expect(out "{\n printf a\n printf b\n}\nprintf c").to_be 'abc'
    expect(out [[{ x=1 }; printf $x]]).to_be '1'
    expect(out [[{ }; printf a]]).to_be 'a'

- it goes on after a block with || only if a command of it fails: |
    expect(out [[{ printf a; false } || printf b]]).to_be 'ab'
    expect(out [[{ printf a } || printf b]]).to_be 'a'
    expect(out [[false || { printf a }]]).to_be 'a'

- it redirects all that a block or a for runs, and then puts back what it replaced: |
    expect(out [[{ printf a; printf b } > f; printf y; cat f]]).to_be 'yab'
    expect(out [[for f in 1 2 { printf $f } > f; printf y; cat f]]).to_be 'y12'
    expect(out [[{ sh -c 'printf e >&2' } 2> f; printf y; cat f]]).to_be 'ye'
    expect(out [[{ printf a } >> f; { printf b } >> f; cat f]]).to_be 'ab'
    local text, status = crushed [[{ printf x } > /no/such/dir/f; printf z]]
    expect(text).to_contain '/no/such/dir/f'
    expect(text).not_to_match 'z$'
    expect(status).to_be(1)

- it sets script variables with assignments on their own, that programs do not see: |
    expect(out [[x=1; y=2; printf $x$y]]).to_be '12'
    expect(out "x=1\ny=2\nprintf $x$y").to_be '12'
    expect(out [[x=1; printf '<%s>' $x; sh -c 'printf "[%s]" "$x"']]).
       to_be '<1>[]'

- it sets an env for what the statement after it runs, and then removes it: |
    local show = [[sh -c 'printf "[%s]" "$X"']]
    expect(out('X=1 ' .. show .. '; ' .. show)).to_be '[1][]'
    expect(out('X=1 { ' .. show .. '; ' .. show .. ' }; ' .. show)).
       to_be '[1][1][]'
    expect(out('X=1 for f in a b { ' .. show .. ' }; ' .. show)).
       to_be '[1][1][]'
    expect(out('X=1 { X=2 ' .. show .. '; ' .. show .. ' }')).to_be '[2][1]'
    expect(out('X=[a b] ' .. show)).to_be '[a b]'
    expect(out [[X=1 { printf '<%s>' $X }]]).to_be '<>'
    expect(out('X=1 Y=2 { sh -c \'printf "%s%s" "$X" "$Y"\' } > f; cat f')).
       to_be '12'

- it ends with the status of the command that fails: |
    expect(select(2, crushed [[sh -c 'exit 7'; printf no]])).to_be(7)

- it refuses a script that it cannot run before it runs any of it: |
    for _, bad in ipairs {'a | b', 'if x', 'x=$(y)', "echo 'x",
       'a ||', '|| a', 'a ||\nb', 'x=1 || a', 'a || x=1', 'x=[a || b]',
       'for f in a {', '}', 'for f { a }', 'for in a {\n}',
       'for f in a', 'for f in a { b', 'for f in a { a || }',
       'for f in a { b } c',
       'x=1 >> foo', 'x=1 y=2', 'x=1 y=2 # c', '> f', 'printf a > f b', '{ a } c',
       '{ a', '{ a } >', 'x=1 y=2 > f', '{ a } || ', 'for f in a { b } > f x'} do
       local out, status = crushed('printf no\n' .. bad)
       expect(status).to_be(3)
       expect(out).to_match '^%./script: 2:%d+: '
    end
