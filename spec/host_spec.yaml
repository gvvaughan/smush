before:
  host = require 'smush.host'

specify smush.host:
- describe path:
  - it finds the host files next to the bin directory of the script: |
      for _, name in ipairs {'crush.c', 'barfx.c'} do
         expect(host.path(name, './bin/smush')).to_be('./host/' .. name)
         expect(host.path(name, 'bin/smush')).to_be('host/' .. name)
      end

  - it finds the host files of a rock, next to the bin directory in it: |
      local dir = os.tmpname()
      os.remove(dir)
      assert(os.execute('mkdir -p ' .. dir .. '/bin ' .. dir .. '/host'))
      assert(io.open(dir .. '/host/crush.c', 'w')):close()
      expect(host.path('crush.c', dir .. '/bin/smush')).
         to_be(dir .. '/host/crush.c')
      os.execute('rm -rf ' .. dir)

  - it gives nil for a host file that is not next to the script: |
      expect(host.path('no-such-file.c', './bin/smush')).to_be(nil)
      expect(host.path('crush.c', '/nowhere/bin/smush')).to_be(nil)

  - it gives nil without a script in a bin directory, and finds nothing else: |
      expect(host.path 'crush.c').to_be(nil)
      expect(host.path('crush.c', 'smush')).to_be(nil)

- describe read:
  - it reads the host files next to the bin directory of the script: |
      local file = assert(io.open 'host/barfx.c', 'rb')
      local text = file:read '*a'
      file:close()
      expect(host.read('barfx.c', './bin/smush')).to_be(text)

  - it gives nil for a host file that is not there: |
      expect(host.read('crush.c', '/nowhere/bin/smush')).to_be(nil)

  - it reads the payload of a standalone program, and only that: |
      local fresh = loadfile(package.searchpath('smush.host', package.path))()
      local reads = {}
      fresh.payload = function()
         return {read = function(path)
            reads[#reads + 1] = path
            return path == 'host/crush.c' and 'in the payload' or nil
         end}
      end
      expect(fresh.read('crush.c', './bin/smush')).to_be 'in the payload'
      expect(fresh.read('barfx.c', './bin/smush')).to_be(nil)
      expect(reads).to_equal {'host/crush.c', 'host/barfx.c'}
