before:
  barf = require 'smush.barf'

  -- The barf that barfx has to read with each file it makes.
  entries = {
     {path = 'main.lua', data = 'print "hi"\n'},
     {path = 'deps/lua/src/lua.h', data = 'int x;\n'},
     {path = 'build', data = '#!/bin/sh\necho build\n'},
     {path = 'a b/c d.txt', data = ''},
     {path = 'bin', data = '\0\1\2\255\n\n'},
  }

  -- The body of a barf with a trailer for *entries*.
  function sealed(...)
     local body = '!<barf>\n' .. table.concat {...}
     return body .. ('%015d\n'):format(#body)
  end

specify barfx:
- it unpacks the files of a barf with their contents:
    local listing, status = unpacked(barf.pack(entries),
       'cat main.lua deps/lua/src/lua.h "a b/c d.txt"; od -An -tx1 bin')
    expect(status).to_be(0)
    expect(listing).to_match '^print "hi"\nint x;\n'
    expect(listing).to_contain '00 01 02 ff 0a 0a'

- it unpacks a barf that follows other bytes:
    local listing, status = unpacked('\35!/bin/sh\nexit 0\n' ..
       barf.pack {{path = 'x', data = 'abc'}}, 'cat x')
    expect(status).to_be(0)
    expect(listing).to_be 'abc'

- it unpacks a compressed barf as it does a plain one, of data that repeats and data that does not:
    local words = ('some words, '):rep(5000)
    math.randomseed(7)
    local noise = {}
    for i = 1, 3000 do noise[i] = string.char(math.random(0, 255)) end
    local big = {
       {path = 'words', data = words},
       {path = 'noise', data = table.concat(noise) .. words:sub(1, 300)},
       {path = 'empty', data = ''},
       {path = 'run', data = ('a'):rep(70000)},
    }
    local inspect = 'cksum words noise empty run'
    local plain, status = unpacked(barf.pack(big), inspect)
    local packed, zstatus = unpacked(barf.pack(big, {compress = true}), inspect)
    expect({status, zstatus}).to_equal {0, 0}
    expect(packed).to_be(plain)

- it refuses a compressed barf that is broken:
    local packed = barf.pack(entries, {compress = true}):sub(1, -17)
    for _, bad in ipairs {
       packed:sub(1, 30),
       packed:sub(1, 9) .. ('%015d\n'):format(3) .. packed:sub(26),
       packed:sub(1, 9) .. 'not a number   \n' .. packed:sub(26),
    } do
       local listing, status, err = unpacked(
          bad .. ('%015d\n'):format(#bad), 'ls')
       expect(status).to_be(1)
       expect(err).to_match '^barfx:'
       expect(listing).to_be ''
    end

- it unpacks an empty barf:
    local listing, status = unpacked(barf.pack {}, 'ls')
    expect({listing, status}).to_equal {'', 0}

- it refuses a barf that it cannot trust:
    for _, bad in ipairs {
       sealed('3 ../x\nabc\n'),
       sealed('3 /tmp/x\nabc\n'),
       sealed('3 a//b\nabc\n'),
       sealed('9 x\nabc\n'),
       sealed('3\nabc\n'),
    } do
       local listing, status, err = unpacked(bad, 'ls')
       expect(status).to_be(1)
       expect(err).to_match '^barfx:'
       expect(listing).to_be ''
    end

- it refuses a file that is not a barf:
    local _, status, err = unpacked 'hello'
    expect(status).to_be(1)
    expect(err).to_contain 'no trailer'

- it has only what reads a barf in memory with BARFX_LIBRARY, that a program can use: |
    -- Print the first entry of the indexed barf on standard input, from
    -- a pointer to constant bytes, which compiles only if the library
    -- never writes to the barf.
    local source = os.tmpname()
    local exe = os.tmpname()
    local file = io.open(source, 'w')
    file:write [[
    #define BARFX_LIBRARY
    #include "barfx.c"

    int
    main(void)
    {
        static char buf[1 << 16];
        const char *barf = buf;
        unsigned long length, namelen, size;
        const char *name, *data;
        size_t n = fread(buf, 1, sizeof buf, stdin);
        int bad;

        if (n < 16 || barf_length(barf + n - 16, &length) || length > n - 16)
            return 2;
        if (memcmp(barf + n - 16 - length, "!<barfx>\n", 9))
            return 3;
        bad = barf_entry(barf + n - 16 - length + 9, barf + n - 16, &name,
                         &namelen, &data, &size);
        if (bad)
            return 10 + bad;
        printf("%.*s %lu\n%.*s", (int) namelen, name, size, (int) size, data);
        return 0;
    }
    ]]
    file:close()
    assert(os.execute(('${CC:-cc} ${CPPFLAGS} -D_XOPEN_SOURCE=700 -Ihost ' ..
                       '-Wall -Wextra -Werror -o %s -x c %s'):format(exe, source)))

    local function reads(barfx)
       local input = os.tmpname()
       local f = io.open(input, 'wb')
       f:write(barfx)
       f:close()
       local pipe = io.popen(exe .. ' < ' .. input .. '; echo "status $?"')
       local output = pipe:read '*a'
       pipe:close()
       os.remove(input)
       return output:match '^(.*)status (%d+)\n$'
    end

    local good = barf.pack(entries, {index = true})
    local text, status = reads(good)
    expect(status).to_be '0'
    expect(text).to_match '^index %d+\nreturn {\n{"main.lua", '
    expect(text).to_contain '{"bin", '

    local function sealed_x(...)
       local body = '!<barfx>\n' .. table.concat {...}
       return body .. ('%015d\n'):format(#body)
    end
    expect(select(2, reads('hello'))).to_be '2'
    expect(select(2, reads(sealed_x('3\nabc\n')))).to_be '11'
    expect(select(2, reads(sealed_x('9 index\nabc\n')))).to_be '12'
    os.remove(source)
    os.remove(exe)
