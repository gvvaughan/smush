before:
  barf = require 'smush.barf'

  entries = {
     {path = 'main.lua', data = 'print "hi"\n'},
     {path = 'deps/lua/src/lua.h', data = 'int x;\n'},
     {path = 'build', data = '#!/bin/sh\necho build\n'},
     {path = 'a b/c d.txt', data = ''},
     {path = 'bin', data = '\0\1\2\255\n\n'},
  }

specify smush.barf:
- describe pack:
  - it starts with the magic:
      expect(barf.pack(entries):sub(1, 8)).to_be '!<barf>\n'

  - it ends with a trailer of the length of what is before it:
      local bytes = barf.pack(entries)
      expect(#bytes - 16).to_be(tonumber(bytes:sub(-16, -2)))
      expect(bytes:sub(-1)).to_be '\n'
      expect(bytes:sub(-16, -2)).to_match '^%d%d%d%d%d%d%d%d%d%d%d%d%d%d%d$'

  - it writes a header line for each entry:
      expect(barf.pack {{path = 'x/y', data = 'abc'}}).
         to_be('!<barf>\n3 x/y\nabc\n' .. '000000000000018\n')

  - it makes the same bytes every time:
      expect(barf.pack(entries)).to_be(barf.pack(entries))

  - it makes a barf with no entries:
      expect(barf.pack {}).to_be('!<barf>\n' .. '000000000000008\n')

  - it keeps the path and data of each entry: |
      local got = assert(unbarf(barf.pack(entries)))
      expect(#got).to_be(#entries)
      for i, entry in ipairs(entries) do
         expect(got[i].path).to_be(entry.path)
         expect(got[i].data).to_be(entry.data)
      end

  - it refuses a path that is not allowed:
      for path, why in pairs {
         [''] = 'is empty',
         ['/etc/passwd'] = 'is absolute',
         ['../x'] = 'has a ".." component',
         ['a/../x'] = 'has a ".." component',
         ['a//b'] = 'has an empty component',
         ['a/'] = 'has an empty component',
         ['a\nb'] = 'has a newline',
         ['a\0b'] = 'has a NUL',
      } do
         expect(barf.pack {{path = path, data = ''}}).to_raise(why)
      end

  - it refuses a path that is there twice:
      expect(barf.pack {{path = 'x', data = ''}, {path = 'x', data = 'y'}}).
         to_raise 'there twice'

  - it refuses an entry that has no data:
      expect(barf.pack {{path = 'x'}}).to_raise 'no data'

- describe pack with index:
  - it names the entries by number, and has their paths in the index: |
      local bytes = barf.pack(entries, {index = true})
      expect(bytes:sub(1, 8)).to_be '!<barx>\n'
      expect(bytes).to_contain '\n11 1\nprint "hi"\n\n7 2\n'
      expect(bytes).not_to_contain ' main.lua\n'

  - it gives the paths back from the index, and the data: |
      local list = assert(unbarf(barf.pack(entries, {index = true})))
      expect(#list).to_be(#entries)
      for i, entry in ipairs(entries) do
         expect(list[i].path).to_be(entry.path)
         expect(list[i].data).to_be(entry.data)
      end

  - it gives the offset of the data from the end of the index: |
      local bytes = barf.pack(entries, {index = true})
      local _, header = bytes:find('^!<barx>\n%d+ index\n')
      local size = tonumber(bytes:match '^!<barx>\n(%d+) ')
      local base = header + size + 1
      local rows = load(bytes:sub(header + 1, header + size), '=index',
                        't', {})()
      expect(#rows).to_be(#entries)
      for i, row in ipairs(rows) do
         expect(row[1]).to_be(entries[i].path)
         expect(row[3]).to_be(#entries[i].data)
         expect(bytes:sub(base + row[2] + 1, base + row[2] + row[3])).
            to_be(entries[i].data)
      end

  - it makes no index unless it is asked for:
      expect(barf.pack(entries):sub(1, 8)).to_be '!<barf>\n'

  - it refuses an entry that has no data before it makes the index:
      expect(barf.pack({{path = 'x'}}, {index = true})).
         to_raise 'no data'
