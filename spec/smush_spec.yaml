before: |
  function spit(filename, content)
     local h = assert(io.open(filename, 'w'))
     h:write(content)
     h:close()
  end

  -- What `showbundled` writes, in the bundle that smush wrote as *output*.
  function shown(output)
     local text = {}
     load(output)().showbundled(function(s) text[#text + 1] = s end)
     return table.concat(text)
  end

  -- What `smush` writes for *args*, given the modules beneath *tmpdir*
  -- to find, when it runs as the script *script*, as a specl Process.
  function smush_as(script, tmpdir, ...)
     return capture(function(script, tmpdir, ...)
        package.path = tmpdir .. '/?.lua;' .. package.path
        local args = {...}
        args[0] = script
        return require 'smush'.main(args)
     end, script, tmpdir, ...)
  end

  -- What `smush` writes for *args*, as it does when run from a clone.
  function smush(tmpdir, ...)
     return smush_as('./bin/smush', tmpdir, ...)
  end

