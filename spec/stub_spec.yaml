before: |
  barf = require 'smush.barf'

  local function slurp(path)
     local file = assert(io.open(path, 'rb'))
     local text = file:read '*a'
     file:close()
     return text
  end

  -- A crush that runs its script with sh, and that is not run unless the
  -- stub gives it -x to show the commands.  The stub only needs a program
  -- that runs `build`, so these examples need not wait for the real one
  -- to compile.
  local CRUSH_C = [[
     #include <string.h>
     #include <unistd.h>

     int
     main(int argc, char **argv)
     {
         if (argc != 3 || strcmp(argv[1], "-x"))
             return 99;
         execl("/bin/sh", "sh", argv[2], (char *) 0);
         return 127;
     }
  ]]

  -- Write the stub of a program called `hello` in a new directory, with
  -- the compressed barf of crush.c and *build*, a shell script, after it
  -- if there is one, and return the directory.
  function stubbed(build)
     local dir = io.popen('mktemp -d'):read '*l'
     local text = slurp('host/stub.sh.in'):gsub('@(%u[%u_]*)@', {
        NAME = 'hello', ID = '42',
        BARFX_C = slurp('host/barfx.c'),
     })
     local file = io.open(dir .. '/hello', 'wb')
     file:write(text)
     if build then
        file:write(barf.pack({
           {path = 'crush.c', data = CRUSH_C},
           {path = 'build', data = build},
        }, {compress = true}))
     end
     file:close()
     return dir
  end

  -- Run the stub in *dir* with *args*, with the cache and the
  -- temporary files in *dir*, and *env*, more of the environment, if
  -- there is any.  Return what it wrote to its standard
  -- output, its exit status, and what it wrote to its standard error.
  function started(dir, args, env)
     local pipe = io.popen(([[cd %s && %s XDG_CACHE_HOME=%s/cache \
        TMPDIR=%s sh ./hello %s 2>%s/err; echo "status $?"]]):
        format(dir, env or '', dir, dir, args or '', dir))
     local output = pipe:read '*a'
     pipe:close()
     local out, status = output:match '^(.*)status (%d+)\n$'
     return out, tonumber(status), slurp(dir .. '/err')
  end

  -- What is in the cache of *dir*, one path to a line.
  function kept(dir)
     return io.popen('cd ' .. dir ..
        ' && find cache -type f 2>/dev/null | sort'):read '*a'
  end

specify stub:
- it builds the program on the first run, keeps it, and starts it, and starts the kept program on a later run without building it: |
    local dir = stubbed [[
       printf '%s\n' '#!/bin/sh' 'echo hello "$@"' > "$OUT"
    ]]
    local out, status, err = started(dir, 'a b')
    expect({out, status}).to_equal {'hello a b\n', 0}
    expect(err).to_contain 'building a program for this machine'
    expect(kept(dir)).to_match '^cache/hello/42%-[%w_]+%-[%w_]+/hello\n$'
    expect({started(dir, 'again')}).to_equal {'hello again\n', 0, ''}
    os.execute('rm -rf ' .. dir)

- it keeps nothing when the build fails: |
    local dir = stubbed 'exit 5\n'
    local out, status, err = started(dir)
    expect({out, status}).to_equal {'', 1}
    expect(err).to_contain 'hello: the build failed'
    expect(kept(dir)).to_be ''
    os.execute('rm -rf ' .. dir)

- it fails when there is no barf to unpack: |
    local dir = stubbed()
    local out, status, err = started(dir)
    expect({out, status}).to_equal {'', 1}
    expect(err).to_contain 'hello: cannot unpack this file'
    expect(kept(dir)).to_be ''
    os.execute('rm -rf ' .. dir)

- it installs the program that it built in SMUSH_STANDALONE_INSTALL_DIR, and stops without running it: |
    local dir = stubbed [[
       printf '%s\n' '#!/bin/sh' 'echo hello "$@"' > "$OUT"
    ]]
    os.execute('mkdir ' .. dir .. '/bin')
    local env = 'SMUSH_STANDALONE_INSTALL_DIR=' .. dir .. '/bin'
    local out, status, err = started(dir, 'a', env)
    expect({out, status}).to_equal {'', 0}
    expect(err).to_contain 'hello: building a program for this machine'
    expect(err).to_contain('hello: installed ' .. dir .. '/bin/hello\n')
    expect(io.popen('cd ' .. dir .. ' && ls bin'):read '*a').to_be 'hello\n'
    expect(io.popen(dir .. '/bin/hello b'):read '*a').to_be 'hello b\n'
    os.execute('rm -rf ' .. dir)

- it installs the kept program on a later run, and replaces a different one: |
    local dir = stubbed [[
       printf '%s\n' '#!/bin/sh' 'echo hello "$@"' > "$OUT"
    ]]
    started(dir)
    os.execute('mkdir ' .. dir .. '/bin && echo old > ' .. dir .. '/bin/hello')
    local env = 'SMUSH_STANDALONE_INSTALL_DIR=' .. dir .. '/bin'
    expect({started(dir, 'again', env)}).to_equal {'', 0,
       'hello: installed ' .. dir .. '/bin/hello\n'}
    expect(io.popen(dir .. '/bin/hello c'):read '*a').to_be 'hello c\n'
    expect(io.popen('ls ' .. dir .. '/bin'):read '*a').to_be 'hello\n'
    os.execute('rm -rf ' .. dir)

- it warns, and runs nothing, when the same program is installed already: |
    local dir = stubbed [[
       printf '%s\n' '#!/bin/sh' 'echo hello "$@"' > "$OUT"
    ]]
    os.execute('mkdir ' .. dir .. '/bin')
    local env = 'SMUSH_STANDALONE_INSTALL_DIR=' .. dir .. '/bin'
    started(dir, nil, env)
    local out, status, err = started(dir, 'again', env)
    expect({out, status}).to_equal {'', 0}
    expect(err).to_contain('hello: SMUSH_STANDALONE_INSTALL_DIR is set, but ' ..
       dir .. '/bin/hello is the same program already, so nothing was run')
    expect(err).not_to_contain 'installed'
    os.execute('rm -rf ' .. dir)

- it runs the program when the variable is empty or unset: |
    local dir = stubbed [[
       printf '%s\n' '#!/bin/sh' 'echo hello "$@"' > "$OUT"
    ]]
    os.execute('mkdir ' .. dir .. '/bin')
    expect((started(dir, 'x', 'SMUSH_STANDALONE_INSTALL_DIR='))).to_be 'hello x\n'
    expect((started(dir, 'y'))).to_be 'hello y\n'
    expect(io.popen('ls ' .. dir .. '/bin'):read '*a').to_be ''
    os.execute('rm -rf ' .. dir)

- it fails when the directory is not there, and runs nothing: |
    local dir = stubbed [[
       printf '%s\n' '#!/bin/sh' 'echo hello "$@"' > "$OUT"
    ]]
    local env = 'SMUSH_STANDALONE_INSTALL_DIR=' .. dir .. '/none'
    local out, status, err = started(dir, 'a', env)
    expect({out, status}).to_equal {'', 1}
    expect(err).to_contain('hello: cannot install the program in ' .. dir ..
                           '/none')
    expect(io.popen('ls ' .. dir):read '*a').not_to_contain 'none'
    os.execute('rm -rf ' .. dir)
